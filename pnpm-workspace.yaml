packages:
  - packages/*
  - playground/*

catalogs:
  dev:
    '@nuxt/kit': ^4.7.0
    '@nuxt/schema': ^4.7.0
    '@arethetypeswrong/core': ^0.18.5
    '@vitejs/plugin-vue': ^6.0.11
    '@vitest/browser-playwright': ^5.1.2
    playwright: ^1.65.1
    publint: ^0.3.25
    tsdown: ^0.23.7
    typescript: ^6.0.3
    vite: ^8.3.8
    vitest: ^5.1.2
    vitest-browser-vue: ^3.1.0
    # 3.3.13 breaks template type-checks.
    vue-tsc: 3.3.11
  frontend:
    pinia: ^4.1.0
    vue: 3.6.0-rc.16
    vue-i18n: ^11.4.23
  schemas:
    '@standard-schema/spec': ^1.1.0
    arktype: ^2.2.10
    effect: ^4.1.5
    joi: ^18.3.2
    valibot: ^1.5.0
    yup: ^1.7.1
    zod: ^4.6.7

allowBuilds:
  esbuild: true

overrides:
  # Security: lift only the vulnerable ranges of transitive dev deps (pnpm audit).
  'glob@>=9.0.0 <14.0.2': ^14.0.2
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  vue: 3.6.0-rc.16
  '@vue/compiler-core': 3.6.0-rc.16
  '@vue/compiler-dom': 3.6.0-rc.16
  '@vue/compiler-sfc': 3.6.0-rc.16
  '@vue/compiler-ssr': 3.6.0-rc.16
  '@vue/compiler-vapor': 3.6.0-rc.16
  '@vue/reactivity': 3.6.0-rc.16
  '@vue/runtime-core': 3.6.0-rc.16
  '@vue/runtime-dom': 3.6.0-rc.16
  '@vue/runtime-vapor': 3.6.0-rc.16
  '@vue/server-renderer': 3.6.0-rc.16
  '@vue/shared': 3.6.0-rc.16

minimumReleaseAgeExclude:
  - vue@3.6.0-rc.16
  - '@vue/compiler-core@3.6.0-rc.16'
  - '@vue/compiler-dom@3.6.0-rc.16'
  - '@vue/compiler-sfc@3.6.0-rc.16'
  - '@vue/compiler-ssr@3.6.0-rc.16'
  - '@vue/compiler-vapor@3.6.0-rc.16'
  - '@vue/reactivity@3.6.0-rc.16'
  - '@vue/runtime-core@3.6.0-rc.16'
  - '@vue/runtime-dom@3.6.0-rc.16'
  - '@vue/runtime-vapor@3.6.0-rc.16'
  - '@vue/server-renderer@3.6.0-rc.16'
  - '@vue/shared@3.6.0-rc.16'
  - vael-ui@0.5.8
