name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Playwright's image has Chromium and every library it needs. Keep its tag at the lockfile's Playwright version.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # In the container the checkout belongs to another user, and git won't read a repository it
      # doesn't own (changesets needs it to find where the branch left main).
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest

      - run: pnpm install
      - run: pnpm test
      - run: pnpm build
      - run: pnpm typecheck

      # Diagnostic, to remove once publishing works: the claims npm checks the trusted publisher
      # against. Only the decoded, non-secret claims are printed, never the token.
      - name: Print the OIDC claims npm will see
        env:
          REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).value)')
          echo "::add-mask::$TOKEN"
          TOKEN="$TOKEN" node -e '
            const claims = JSON.parse(Buffer.from(process.env.TOKEN.split(".")[1], "base64url"));
            for (const key of ["iss", "aud", "sub", "repository", "repository_owner", "repository_id", "repository_owner_id", "workflow", "workflow_ref", "job_workflow_ref", "ref", "event_name", "environment", "runner_environment"])
              console.log(key.padEnd(20), JSON.stringify(claims[key]));
          '

      # Opens a "Version packages" PR from the changesets; merging it publishes to npm.
      - uses: changesets/action@v2
        with:
          publish-script: pnpm release
          version-script: pnpm version-packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
